<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Profile Page</title>
    <!-- Linking our external styling sheet -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/task-tracker.css">
</head>
<body>
 

    <!-- Main Container Card -->
    <div class="profile-card">
        
        <!-- Profile Picture (Ensure you have a picture in your images folder named profile.jpg) -->
        <img src="assets/images/profile.jpg" alt="My Profile Picture" class="profile-pic">
        
        <!-- Introduction Header -->
        <h1>Hi, I'm Alfie!</h1>
<h3 id="welcome-heading">Welcome to My Web Application</h3>
    
    <!-- Clicking this button triggers the function in our external script -->
    <button onclick="changeText()">Click Me</button><!-- Clicking this button triggers the function in our external script -->
        
        <!-- Subheading/Role -->
        <p class="subtitle">Aspiring Full Stack Developer</p>
        
        <!-- Short Biography Paragraph -->
        <p class="bio">
            Welcome to my practice pages! 

   
        </p>
        
        <!-- External Social Link -->
        <a href="https://github.com" target="_blank" class="cta-button">View My GitHub</a>
        
    </div>

    <!-- Task Tracker Section -->
    <div class="task-tracker-container">
        <div class="task-tracker">
            <h2>Task Tracker</h2>
            
            <!-- Add Task Form -->
            <div class="task-input-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    class="task-input" 
                    placeholder="Add a new task..."
                    aria-label="New task title"
                >
                <button id="addTaskBtn" class="add-task-btn">Add Task</button>
            </div>

            <!-- Task List -->
            <ul id="taskList" class="task-list"></ul>

            <!-- Empty State Message -->
            <p id="emptyMessage" class="empty-message">No tasks yet. Add one to get started!</p>
        </div>
    </div>

    <!-- Linka external JavaScript file -->
    <script src="js/script.js"></script>
    <script src="js/task-tracker.js"></script>

</body>
</html>
